spring.application.name=platform
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agri_invest}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your_local_safe_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always
server.port=8081
agriinvest.jwt.secret=${JWT_SECRET_KEY:defaultValueMakeItA32ByteLongSecureStringForProductionUse}
agriinvest.jwt.expirationMs=86400000
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=agri-invest-backend
